---
systemd_service_httpd_proxy_manage_packages: true
systemd_service_httpd_proxy_conf_dir: /etc/httpd/conf.d
systemd_service_httpd_proxy_log_dir: /var/log/httpd
# Name-based reverse proxy vhosts. Each entry: server_name, upstream
# (e.g. http://127.0.0.1:8080/), optional conf_name (default <server_name>.conf).
systemd_service_httpd_proxy_vhosts: []
# Extra site templates (landing pages, bespoke vhosts). Each entry: src, dest,
# optional owner/group/mode. src resolves via the playbook search path.
systemd_service_httpd_proxy_extra_templates: []
