---
- name: Package - httpd
  ansible.builtin.package:
    name: httpd
    state: present
  become: true
  when: systemd_service_httpd_proxy_manage_packages | bool

- name: Install reverse proxy vhosts
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "{{ systemd_service_httpd_proxy_conf_dir }}/{{ item.conf_name | default(item.server_name ~ '.conf') }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ systemd_service_httpd_proxy_vhosts }}"
  loop_control:
    label: "{{ item.server_name }}"
  notify: Reload httpd

- name: Ensure extra template directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ systemd_service_httpd_proxy_extra_templates | map(attribute='dest') | map('dirname') | unique | list }}"

- name: Install extra templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0644') }}"
  become: true
  loop: "{{ systemd_service_httpd_proxy_extra_templates }}"
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload httpd

- name: Service - httpd
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
  become: true
