---
- name: Grafana
  ansible.builtin.include_role:
    name: jamesread.soe.podman_app
  vars:
    podman_app_name: grafana
    podman_app_image: "{{ podman_app_grafana_image }}"
    podman_app_external_address: "{{ podman_app_grafana_external_address }}"
    podman_app_external_title: Grafana
    podman_app_external_description: Dashboards
    podman_app_ports: "{{ podman_app_grafana_ports }}"
    podman_app_volumes: "{{ podman_app_grafana_volumes }}"
    podman_app_env: "{{ podman_app_grafana_env }}"
