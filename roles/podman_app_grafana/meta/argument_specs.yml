---
argument_specs:
  main:
    short_description: Run Grafana as a systemd service, using the podman_app role.
    options:
      podman_app_grafana_image:
        type: str
        default: docker.io/grafana/grafana:latest
        description: Grafana container image.
      podman_app_grafana_ports:
        type: list
        elements: str
        default: ['3000:3000']
        description: Published ports, as for podman_app_ports.
      podman_app_grafana_volumes:
        type: list
        elements: str
        default: ['grafana-data:/var/lib/grafana']
        description: Volumes, as for podman_app_volumes. Override to keep existing data in a host directory.
      podman_app_grafana_env:
        type: dict
        default: {}
        description: Grafana settings as environment variables, eg GF_SERVER_ROOT_URL.
      podman_app_grafana_external_address:
        type: str
        default: ''
        description: Hostname to publish Grafana at, via a proxy role (see podman_app_external_address). Empty does not publish it.
