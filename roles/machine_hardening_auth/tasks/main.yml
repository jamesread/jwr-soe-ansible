---
- name: Install hardened sshd drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: "{{ machine_hardening_auth_sshd_dropin }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Reload sshd

# sshd uses the first value it reads for each option, so this block goes at the
# very top of sshd_config, ahead of the Include of sshd_config.d/*.conf.
# blockinfile only honours insertbefore for a new block, so a block left
# further down (eg by an older version, which appended it) is removed first.
- name: Move sshd hardening block to the top of the main config
  when: machine_hardening_auth_sshd_config_block | bool
  become: true
  vars:
    machine_hardening_auth_marker_begin: "# BEGIN ANSIBLE {{ machine_hardening_auth_label | upper }} HARDENING"
  block:
    - name: Read sshd_config
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: machine_hardening_auth_sshd_config

    - name: Remove sshd hardening block that is not at the top
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE {{ machine_hardening_auth_label | upper }} HARDENING"
        state: absent
      when:
        - machine_hardening_auth_marker_begin in machine_hardening_auth_sshd_config_text
        - not machine_hardening_auth_sshd_config_text.startswith(machine_hardening_auth_marker_begin)
      vars:
        machine_hardening_auth_sshd_config_text: "{{ machine_hardening_auth_sshd_config.content | b64decode }}"

- name: Enforce sshd hardening at the top of the main config
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE {{ machine_hardening_auth_label | upper }} HARDENING"
    block: "{{ lookup('ansible.builtin.template', 'sshd-options.j2') | trim }}"
    insertbefore: BOF
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  when: machine_hardening_auth_sshd_config_block | bool
  notify: Reload sshd

- name: Verify sshd hardening took effect
  when: machine_hardening_auth_verify | bool
  become: true
  vars:
    machine_hardening_auth_sshd_effective_lines: "{{ machine_hardening_auth_sshd_effective.stdout_lines | map('lower') | list }}"
  block:
    - name: Read effective sshd config
      ansible.builtin.command: /usr/sbin/sshd -T
      register: machine_hardening_auth_sshd_effective
      changed_when: false
      check_mode: false

    - name: Assert hardening options are effective
      ansible.builtin.assert:
        that:
          - (item.key ~ ' ' ~ item.value) | lower in machine_hardening_auth_sshd_effective_lines
        fail_msg: >-
          sshd is not using {{ item.key }} {{ item.value }}. Another setting
          (eg a Match block or earlier config) is overriding it.
        quiet: true
      loop: "{{ machine_hardening_auth_sshd_options | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert AllowUsers is effective
      ansible.builtin.assert:
        that:
          - ('allowusers ' ~ item) | lower in machine_hardening_auth_sshd_effective_lines
        fail_msg: sshd is not allowing user {{ item }}. Another setting is overriding AllowUsers.
        quiet: true
      loop: "{{ machine_hardening_auth_ssh_allow_users }}"

- name: Fail2ban
  when: machine_hardening_auth_fail2ban | bool
  become: true
  block:
    - name: Package - fail2ban
      ansible.builtin.package:
        name: fail2ban
        state: present

    - name: Install fail2ban sshd jail
      ansible.builtin.template:
        src: fail2ban-sshd.local.j2
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Service - fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
      when: not ansible_check_mode
