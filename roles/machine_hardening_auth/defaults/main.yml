---
# Label used in the drop-in filename, blockinfile marker and file headers.
machine_hardening_auth_label: soe
machine_hardening_auth_header: "Managed by Ansible — {{ machine_hardening_auth_label }} auth hardening"
# sshd uses the first value it reads for each option, and reads drop-ins in
# filename order, so 00- makes this drop-in win over the others.
machine_hardening_auth_sshd_dropin: "/etc/ssh/sshd_config.d/00-{{ machine_hardening_auth_label }}-hardening.conf"
# Also put the settings at the top of sshd_config, before its Include line, so
# they win even where sshd_config sets an option before including drop-ins.
machine_hardening_auth_sshd_config_block: true
# Values are compared against `sshd -T`, so give times in seconds.
machine_hardening_auth_sshd_options:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  X11Forwarding: "no"
  PermitEmptyPasswords: "no"
  PubkeyAuthentication: "yes"
  MaxAuthTries: 3
  LoginGraceTime: 30
  ClientAliveInterval: 300
  ClientAliveCountMax: 2
  LogLevel: VERBOSE
# Empty list omits AllowUsers. Make sure ansible_user is listed.
machine_hardening_auth_ssh_allow_users: []
# Fail the run if `sshd -T` shows any option above did not take effect.
machine_hardening_auth_verify: true
machine_hardening_auth_fail2ban: true
machine_hardening_auth_fail2ban_findtime: 10m
machine_hardening_auth_fail2ban_bantime: 1h
machine_hardening_auth_fail2ban_maxretry: 5
