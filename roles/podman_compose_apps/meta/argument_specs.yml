---
argument_specs:
  main:
    short_description: Deploy rootless Podman Compose apps from compose templates.
    options:
      podman_compose_apps_list:
        type: list
        elements: dict
        default: []
        description:
          - Apps to deploy. Keys are name, app_dir and compose_template, plus optional description, compose_command,
            config_template, files_src/files_dest and script_template/script_dest.
      podman_compose_apps_user:
        type: str
        default: app
        description: User that owns and runs the compose stacks.
      podman_compose_apps_group:
        type: str
        default: app
        description: Group for app files.
      podman_compose_apps_home:
        type: str
        default: /home/app
        description: Home directory of the compose user.
      podman_compose_apps_shell:
        type: str
        default: /bin/bash
        description: Login shell of the compose user. Keep a real shell if it is also ansible_user.
      podman_compose_apps_manage_packages:
        type: bool
        default: false
        description: Install podman and podman-compose.
      podman_compose_apps_pull_images:
        type: bool
        default: true
        description: Pull images and force-recreate every app on each run.
      podman_compose_apps_up_timeout:
        type: int
        default: 180
        description: Seconds before compose up is killed.
      podman_compose_apps_shared_network:
        type: str
        default: ""
        description: Shared Podman network created for cross-stack container DNS. Empty skips.
