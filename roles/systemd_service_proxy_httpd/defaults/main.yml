---
systemd_service_proxy_httpd_manage_packages: true
systemd_service_proxy_httpd_conf_dir: /etc/httpd/conf.d
systemd_service_proxy_httpd_log_dir: /var/log/httpd
# Name-based reverse proxy vhosts. Each entry: server_name, upstream
# (e.g. http://127.0.0.1:8080/), and optionally conf_name (default
# <server_name>.conf), tls (default true) and extra (raw lines for the vhost).
systemd_service_proxy_httpd_vhosts: []
# Extra site templates (landing pages, bespoke vhosts). Each entry: src, dest,
# optional owner/group/mode. src resolves via the playbook search path.
systemd_service_proxy_httpd_extra_templates: []
# Also add a vhost for each podman_app app on this host that sets
# podman_app_external_address (read from the podman_app_external_apps fact).
systemd_service_proxy_httpd_podman_apps: true

# HTTPS with a certificate you supply (paths on the host). When set, vhosts
# also listen on 443, and port 80 redirects to HTTPS.
systemd_service_proxy_httpd_tls_cert: ''
systemd_service_proxy_httpd_tls_key: ''
# Or get a Let's Encrypt certificate for every vhost, with systemd_service_certbot.
systemd_service_proxy_httpd_certbot: false
systemd_service_proxy_httpd_certbot_email: ''
systemd_service_proxy_httpd_certbot_cert_name: "{{ inventory_hostname }}"
# Extra domains for the certificate, besides the vhosts' server names.
systemd_service_proxy_httpd_certbot_extra_domains: []
systemd_service_proxy_httpd_certbot_http_port: 9080
