---
- name: Install reverse proxy vhosts
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "{{ systemd_service_proxy_httpd_conf_dir }}/{{ item.conf_name | default(item.server_name ~ '.conf') }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ systemd_service_proxy_httpd_all_vhosts }}"
  loop_control:
    label: "{{ item.server_name }}"
  register: systemd_service_proxy_httpd_vhost_files
  notify: Reload httpd
