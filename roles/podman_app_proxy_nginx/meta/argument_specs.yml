---
argument_specs:
  main:
    short_description: Run nginx in a container (podman_app) as a name-based reverse proxy for local services.
    options:
      podman_app_proxy_nginx_image:
        type: str
        default: docker.io/library/nginx:stable-alpine
        description: nginx container image.
      podman_app_proxy_nginx_dir:
        type: str
        default: /etc/proxy-nginx
        description: Host directory for the generated config (in conf.d/) and TLS files (in tls/).
      podman_app_proxy_nginx_vhosts:
        type: list
        elements: dict
        default: []
        description: Reverse proxy vhosts. Keys are server_name and upstream, plus optional tls (default true) and extra (raw nginx lines for the vhost's location /).
      podman_app_proxy_nginx_podman_apps:
        type: bool
        default: true
        description:
          - Also add a vhost for each podman_app app on this host that sets podman_app_external_address.
          - Run this role after the podman_app roles in the same play, as it reads the podman_app_external_apps fact they set.
      podman_app_proxy_nginx_tls_cert:
        type: str
        default: ''
        description: Certificate (chain) file on the host for HTTPS. When set, vhosts also listen on 443 and port 80 redirects to HTTPS.
      podman_app_proxy_nginx_tls_key:
        type: str
        default: ''
        description: Private key file on the host for HTTPS.
      podman_app_proxy_nginx_certbot:
        type: bool
        default: false
        description: Get a Let's Encrypt certificate for every vhost (with systemd_service_certbot) and use it for HTTPS.
      podman_app_proxy_nginx_certbot_email:
        type: str
        default: ''
        description: Contact for Let's Encrypt expiry warnings.
      podman_app_proxy_nginx_certbot_cert_name:
        type: str
        description: Name of the Let's Encrypt certificate. Defaults to the inventory hostname.
      podman_app_proxy_nginx_certbot_extra_domains:
        type: list
        elements: str
        default: []
        description: Extra domains for the certificate, besides the vhosts' server names.
      podman_app_proxy_nginx_certbot_http_port:
        type: int
        default: 9080
        description: Port on 127.0.0.1 that certbot answers challenges on.
      podman_app_proxy_nginx_default_server:
        type: bool
        default: true
        description: Turn away requests for hostnames with no vhost, rather than serving the first vhost.
      podman_app_proxy_nginx_ipv6:
        type: bool
        default: true
        description: Also listen on IPv6. Turn off on hosts with IPv6 disabled.
      podman_app_proxy_nginx_client_max_body_size:
        type: str
        default: 100m
        description: Largest request body (eg upload) allowed.
      podman_app_proxy_nginx_extra_conf:
        type: str
        default: ''
        description: Raw nginx config added to the http context, eg extra server blocks.
