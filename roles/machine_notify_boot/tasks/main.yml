---
- name: Local Apprise
  ansible.builtin.include_role:
    name: jamesread.soe.podman_app_apprise
  when:
    - machine_notify_boot_apprise_local | bool
    - podman_app_apprise_deployed is not defined

- name: Package - curl
  ansible.builtin.package:
    name: curl
    state: present
  become: true

- name: Install boot notification script
  ansible.builtin.template:
    src: soe-notify-boot.sh.j2
    dest: "{{ machine_notify_boot_script }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install boot notification service
  ansible.builtin.template:
    src: soe-notify-boot.service.j2
    dest: /etc/systemd/system/soe-notify-boot.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd

- name: Enable boot notification on boot
  ansible.builtin.systemd_service:
    name: soe-notify-boot
    enabled: true
    daemon_reload: true
  become: true

# Run with --tags notify to check notifications get through.
- name: Send a test notification
  tags: [notify, never]
  ansible.builtin.uri:
    url: "{{ machine_notify_boot_apprise_url }}"
    method: POST
    body_format: json
    body:
      title: "{{ inventory_hostname }}: boot notification test"
      body: Test notification from machine_notify_boot.
      type: info
